# MkDocs configuration: https://www.mkdocs.org, theme https://squidfunk.github.io/mkdocs-material/
# Preview locally with `mkdocs serve`; build with `mkdocs build --strict`. Pages are in docs/.
site_name: SCENE pipelines
site_description: SCENE shared DataJoint schemas and ingestion helpers
repo_url: https://github.com/SCENE-Collaboration/SCENE-pipelines
edit_uri: edit/dev/docs/

theme:
  name: material
  logo: images/scene-logo.png
  favicon: images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/scene.css

plugins:
  - search
  - autorefs
  # One page per module of the package, under "API reference".
  - api-autonav:
      modules: ["scene_pipelines"]
      nav_section_title: "API reference"
      exclude_private: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_symbol_type_heading: true
            show_source: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]
            docstring_style: google
            line_length: 120
          inventories:
            - url: https://docs.python.org/3/objects.inv
              domains: [py, std]
  # Notebooks are shown with their saved outputs, not executed.
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false

markdown_extensions:
  - attr_list
  - admonition
  - github-callouts  # README's > [!NOTE] blocks
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - tables

extra:
  generator: false

# The SCENE name with coloured initials, styled in docs/stylesheets/scene.css.
copyright: "<span class='scene-footer'><em><b>S</b>imons <b>C</b>ollaboration on <b>E</b>cological <b>N</b><b>E</b>uroscience</em><span class='scene-logo'></span><strong>Simons Foundation</strong></span>"

nav:
  - Overview: index.md
  - API reference

validation:
  # README links to repo files (examples/, pyproject.toml) that are not doc pages.
  links:
    not_found: info
    unrecognized_links: info
