[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-pipelines"
version = "0.0.1"
description = "SCENE shared DataJoint schemas and ingestion helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datajoint>=2.2",
    "packaging", # required by datajoint > 1
    "typing_extensions>=4.6",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5",
    "pytest>=7",
    "ruff>=0.15",
]
docs = [
    "markdown-callouts>=0.4",
    "mkdocs>=1.6,<2",  # 2.0 drops the plugin system mkdocstrings relies on
    "mkdocs-api-autonav>=0.1",
    "mkdocs-autorefs>=1.2",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "pymdown-extensions<12.2; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["scene_pipelines*"]

[tool.pytest.ini_options]
markers = [
    "db: needs a live DataJoint/MySQL connection (DJ_HOST, etc.)",
]
filterwarnings = [
    "ignore:fetch\\(\\) is deprecated in DataJoint 2\\.0.*:DeprecationWarning",
    "ignore:Positional inserts \\(tuples/lists\\) are deprecated and will be removed in a future version\\..*:DeprecationWarning",
    "ignore:Table class name `.*` contains underscores\\. CamelCase names without underscores are recommended\\.:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["scene_pipelines", "tests"]
# Honor the excludes below also for paths passed explicitly (pre-commit does that).
force-exclude = true
extend-exclude = [
    # Frozen legacy Mathis-lab schemas — keep DJ definitions as-is.
    "examples/mlai_mouse_ar/mlai_schemas/legacy",
    # Demo notebooks import halfway and print long lines on purpose.
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "W",
    "D",  # pydocstyle — Google form when a docstring exists
]
ignore = [
    # Missing docstrings are fine; enforce style only when one is present (D2xx/D4xx).
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "D"]
"examples/mlai_mouse_ar/**/*.py" = ["D"]
